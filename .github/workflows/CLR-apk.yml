name: CLR-apk

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Target'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: write

jobs:
  build-clr-apk:
    name: Build CLR APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Executable Permissions to gradlew
        run: chmod +x gradlew

      - name: Configure Build Environment
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          fi

      - name: Prepare Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name != 'workflow_dispatch' }}
        run: |
          ./gradlew assembleDebug --stacktrace
          # Copy to branded CLR.apk
          mkdir -p app/build/outputs/apk/debug/dist
          cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/dist/CLR.apk
          cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/dist/CLR-debug.apk

      - name: Build Release APK & Bundle
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace || true
          mkdir -p app/build/outputs/apk/release/dist
          cp app/build/outputs/apk/release/*.apk app/build/outputs/apk/release/dist/CLR-release.apk || true

      - name: Upload CLR-apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CLR-apk
          path: |
            app/build/outputs/apk/debug/dist/CLR.apk
            app/build/outputs/apk/debug/dist/CLR-debug.apk
            app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release Artifacts
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: CLR-release-bundle
          path: |
            app/build/outputs/apk/release/dist/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/dist/CLR.apk
            app/build/outputs/apk/release/dist/CLR-release.apk
            app/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
